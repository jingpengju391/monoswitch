name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: |
          npm ci
          npm run bootstrap
      - name: Install Linux static linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Check and test
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo fmt --manifest-path setup/Cargo.toml --check
          npm run check
          npm test
      - name: Build embedded installer
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: npm run build -- --target ${{ matrix.target }}
      - name: Verify browser and isolated installation
        if: runner.os == 'Linux'
        run: |
          npm run build:native
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            extension/public/installers/*.meta.json
            extension/public/installers/*.run
            extension/public/installers/*.exe
            extension/public/installers/*.zip

  bundle:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - run: |
          npm ci
          npm run bootstrap
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: extension/public/installers
      - name: Bundle all platforms
        run: |
          npm run package
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFile } from 'node:fs/promises'
          const catalog = JSON.parse(await readFile('extension/public/installers/catalog.json', 'utf8'))
          assert.deepEqual(catalog.installers.map(item => `${item.os}/${item.arch}`).sort(), [
            'linux/x86_64', 'macos/aarch64', 'macos/x86_64', 'windows/x86_64',
          ])
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: monoswitch-release
          if-no-files-found: error
          path: releases/
