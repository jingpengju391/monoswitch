[package]
name = "monoswitch-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local DDC/CI bridge for the MonoSwitch Chrome extension"

[dependencies]
directories = "6"
fs2 = "0.4"
rcgen = "0.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
